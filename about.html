<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About — Adyaraka Banyu Langit</title>
  <meta name="description" content="About — Adyaraka Banyu Langit">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#030303">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Cpath%20d='M14,6H28A26,26,0,0,1,28,58L28,94H14Z'%20fill='white'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#030303;--text:#f1f5f9;--muted:#7a8596;--border:#1e1e24}
    *{box-sizing:border-box} html{scroll-behavior:smooth}
    body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:hidden}
    a{color:inherit;text-decoration:none} ::selection{background:rgba(255,255,255,0.14)}
    .wrap{max-width:1080px;margin:0 auto;padding:0 32px;position:relative}
    @media(max-width:1100px){.wrap{max-width:960px}} @media(max-width:860px){.wrap{max-width:720px}} @media(max-width:640px){.wrap{padding:0 20px}}
    .mac-nav{margin-top:36px;display:flex;align-items:center;gap:0;padding:6px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:14px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 8px 28px rgba(0,0,0,0.28);max-width:fit-content;position:relative;isolation:isolate}
    .mac-links{display:flex;flex-wrap:wrap;gap:4px;font-family:'Inter',sans-serif;font-size:12.5px;font-weight:500;letter-spacing:0.07em;text-transform:uppercase;color:var(--muted);position:relative;z-index:1}
    .mac-links a{padding:7px 12px;border-radius:10px;transition:color .2s ease;white-space:nowrap;position:relative;z-index:1}
    .mac-links a:hover{color:var(--text)} .mac-links a[aria-current="page"]{color:var(--text)}
    .mac-highlight{position:absolute;top:6px;bottom:6px;left:0;width:0;background:rgba(255,255,255,0.08);border-radius:10px;pointer-events:none;opacity:0;transform:translateX(0);transition:transform .48s cubic-bezier(.16,1,.3,1),width .48s cubic-bezier(.16,1,.3,1),opacity .25s ease;transition-delay:0.06s;z-index:0}
    .mac-nav:hover .mac-highlight{opacity:1}
    section{padding:32px 0 0} .section-title{font-family:'Inter',sans-serif;font-size:12px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);margin:0 0 14px}
    .exp-list{list-style:none;margin:16px 0 0;padding:0;border-top:1px solid var(--border)}
    .exp-item{display:grid;grid-template-columns:130px 1fr;gap:12px 18px;padding:16px 0;border-bottom:1px solid var(--border);font-size:13.8px;line-height:1.6}
    section[aria-labelledby="edu-title"] .exp-list li:last-child{border-bottom:none}
    @media(max-width:640px){.exp-item{grid-template-columns:1fr;gap:4px}}
    .exp-when{color:var(--muted);font-size:12px;white-space:nowrap;padding-top:1px;font-family:'Inter',sans-serif;font-weight:500}
    .exp-what{color:#cbd5e1} .exp-what strong{color:var(--text);font-weight:600} .exp-what em{font-style:normal;color:#94a3b8}
    footer{margin-top:10px;padding:24px 0 44px;border-top:none;display:flex;flex-wrap:wrap;gap:12px 24px;justify-content:space-between;font-size:11.5px;color:var(--muted);font-family:'Inter',sans-serif;font-weight:400}
    .reveal{opacity:0;transform:translateY(18px);transition:opacity .65s ease,transform .65s cubic-bezier(.16,1,.3,1)}
    .reveal.in{opacity:1;transform:none}
    @media(prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}}
    a:focus-visible{outline:1px solid rgba(255,255,255,0.5);outline-offset:3px}
  </style>
</head>
<body>
  <div class="wrap" style="padding-top:28px">
    <nav class="mac-nav reveal" aria-label="Primary">
      <div class="mac-highlight" id="mac-highlight" aria-hidden="true"></div>
      <div class="mac-links" id="mac-links">
        <a href="index.html">Home</a>
        <a href="projects.html">Projects</a>
        <a href="about.html" aria-current="page">About</a>
        <a href="news.html">News</a>
      </div>
    </nav>

    <section class="reveal" aria-label="Curriculum Vitae" style="padding-top:18px">
      <div style="display:flex; flex-wrap:wrap; gap:12px; justify-content:space-between; align-items:center; margin-bottom:14px">
        <h2 class="section-title" style="margin:0">Curriculum Vitae</h2>
        <a href="assets/Adyaraka_Banyu_Langit_Resume.pdf" target="_blank" rel="noreferrer" style="display:inline-flex; align-items:center; gap:8px; padding:8px 12px; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.10); border-radius:10px; font-size:12px; font-weight:500; color:var(--text)">Open PDF ↗</a>
      </div>
      <div style="border:1px solid rgba(255,255,255,0.08); border-radius:14px; overflow:hidden; background:#fff; box-shadow:0 8px 28px rgba(0,0,0,0.28)">
        <object data="assets/Adyaraka_Banyu_Langit_Resume.pdf#view=FitH" type="application/pdf" width="100%" height="900" style="display:block; border:none; background:#fff">
          <iframe src="assets/Adyaraka_Banyu_Langit_Resume.pdf#view=FitH" style="width:100%; height:900px; border:none; display:block; background:#fff" title="CV PDF"></iframe>
          <p style="padding:24px; color:#111; font-family:'Inter',sans-serif; font-size:13px; text-align:center">Your browser can't preview PDFs. <a href="assets/Adyaraka_Banyu_Langit_Resume.pdf" target="_blank" rel="noreferrer" style="border-bottom:1px solid #111">Download CV ↗</a></p>
        </object>
      </div>
    </section>

    <footer class="reveal">
      <div>© <span id="year"></span> Adyaraka Banyu Langit</div>
    </footer>
  </div>
  <script>
    const yearEl = document.getElementById('year');
    if(yearEl) yearEl.textContent = new Date().getFullYear();
    const reveals = document.querySelectorAll('.reveal');
    if(reveals[0]) reveals[0].style.transitionDelay = '0ms';
    requestAnimationFrame(()=> reveals[0]?.classList.add('in'));
    const obs = new IntersectionObserver((entries)=>{entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');obs.unobserve(e.target);}})}, {threshold:0.06,rootMargin:'0px 0px 0px 0px'});
    reveals.forEach((el,i)=>{ if(i===0) return; el.style.transitionDelay=`${Math.min(i*70,220)}ms`; obs.observe(el); });
    const hl=document.getElementById('mac-highlight'); const ml=document.getElementById('mac-links');
    if(hl&&ml){const links=ml.querySelectorAll('a'); const active=ml.querySelector('a[aria-current="page"]'); const nav=hl.parentElement; const place=(el)=>{if(!el||!nav)return; const nr=nav.getBoundingClientRect(); const r=el.getBoundingClientRect(); hl.style.width=r.width+'px'; hl.style.transform=`translateX(${r.left-nr.left}px)`; hl.style.opacity='1';}; if(active) requestAnimationFrame(()=>place(active)); links.forEach(a=>a.addEventListener('mouseenter',()=>place(a))); nav.addEventListener('mouseleave',()=>{const cur=ml.querySelector('a[aria-current="page"]'); if(cur) place(cur); else hl.style.opacity='0';}); window.addEventListener('resize',()=>{const cur=ml.querySelector('a[aria-current="page"]'); if(cur) place(cur);});}
  </script>
</body>
</html>
