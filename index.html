<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adyaraka Banyu Langit — Systems & AI Engineer</title>
  <meta name="description" content="Adyaraka Banyu Langit — CS @ NYCU · Systems & AI Engineer.">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#030303">
  <link rel="icon" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#030303;
      --text:#f1f5f9;
      --muted:#7a8596;
      --border:#1e1e24;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:'Inter', system-ui, -apple-system, sans-serif;
      font-size:16px;
      line-height:1.7;
      -webkit-font-smoothing:antialiased;
      overflow-x:hidden;
    }
    a{color:inherit; text-decoration:none}
    ::selection{background:rgba(255,255,255,0.14)}

    .wrap{
      max-width:1080px;
      margin:0 auto;
      padding:0 32px;
      position:relative;
    }
    @media(max-width:1100px){.wrap{max-width:960px}} @media(max-width:860px){.wrap{max-width:720px}} @media(max-width:640px){ .wrap{padding:0 20px} }

    /* hero — name + black hole side by side */
    .hero{
      display:grid;
      grid-template-columns:1fr 220px;
      gap:24px 32px;
      align-items:center;
      padding:84px 0 32px;
      min-height:92vh;
      position:relative;
      overflow:visible;
    }
    .hero-text{position:relative; z-index:2}
    .np-embed-wrap{display:block; width:257px; height:122px; margin:24px 0 0}
    .np-embed{display:block; width:320px; height:152px; border:0; border-radius:12px; background:#000; transform:scale(0.8026); transform-origin:top left}
    @media(min-width:701px){ .hero-text{top:-68px; transform:scale(1.25); transform-origin:left center} .hero-bh{top:-68px} }
    @media(max-width:700px){
      .hero{grid-template-columns:1fr 160px; gap:20px 20px; padding-top:56px}
    }
    @media(max-width:520px){
      .hero{grid-template-columns:1fr; padding-top:48px}
    }
    .hero-name{
      margin:0;
      font-family:'Inter', system-ui, sans-serif;
      font-weight:700;
      font-size:clamp(42px, 6vw, 64px);
      line-height:1.05;
      letter-spacing:-0.04em;
      color:var(--text);
    }
    .hero-name .eyebrow{
      display:block;
      font-weight:600;
      font-size:0.58em;
      letter-spacing:-0.02em;
      color:var(--muted);
      margin-bottom:6px;
    }
    .hero-name .nm{display:block; font-size:0.58em; letter-spacing:-0.02em}
    .hero-sub{
      margin:14px 0 0;
      font-size:13.5px;
      color:var(--muted);
      font-weight:400;
    }
    .mac-nav{
      margin-top:36px;
      display:flex;
      align-items:center;
      gap:0;
      padding:6px;
      background:rgba(255,255,255,0.05);
      border:1px solid rgba(255,255,255,0.08);
      border-radius:14px;
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
      box-shadow:0 8px 28px rgba(0,0,0,0.28);
      max-width:fit-content;
      position:relative;
      isolation:isolate;
    }
    .mac-links{
      display:flex;
      flex-wrap:wrap;
      gap:4px;
      font-family:'Inter', system-ui, sans-serif;
      font-size:12.5px;
      font-weight:500;
      letter-spacing:0.07em;
      text-transform:uppercase;
      color:var(--muted);
      position:relative;
      z-index:1;
    }
    .mac-links a{
      padding:7px 12px;
      border-radius:10px;
      border-bottom:none;
      transition:color .2s ease;
      white-space:nowrap;
      position:relative;
      z-index:1;
    }
    .mac-links a:hover{color:var(--text)}
    .mac-links a[aria-current="page"]{color:var(--text)}
    .mac-highlight{
      position:absolute;
      top:6px;
      bottom:6px;
      left:0;
      width:0;
      background:rgba(255,255,255,0.08);
      border-radius:10px;
      pointer-events:none;
      opacity:0;
      transform:translateX(0);
      transition:transform .48s cubic-bezier(.16,1,.3,1), width .48s cubic-bezier(.16,1,.3,1), opacity .25s ease;
      transition-delay:0.06s;
      z-index:0;
    }
    .mac-nav:hover .mac-highlight{opacity:1}
    .hero-links{
      margin-top:22px;
      display:flex;
      flex-wrap:wrap;
      gap:10px;
    }
    .hero-links a{
      width:44px;
      height:44px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      background:rgba(255,255,255,0.03);
      border:1px solid rgba(255,255,255,0.06);
      border-radius:12px;
      color:#fff;
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
      transition:background .15s, border-color .15s, transform .15s;
    }
    .hero-links a:hover{
      background:rgba(255,255,255,0.08);
      border-color:rgba(255,255,255,0.12);
      transform:translateY(-1px);
    }
    .hero-links a:active{transform:none}
    .hero-links a svg{
      width:18px;
      height:18px;
      fill:currentColor;
      display:block;
    }
    .hero-links a svg.lucide{fill:none; stroke:currentColor; stroke-width:1.7}
    .hero-rule{
      margin-top:28px;
      border:none;
      border-top:1px solid var(--border);
      grid-column:1 / -1;
    }

    /* black hole — enlarged, blended into bg (not circled) */
    .hero-bh{
      position:relative;
      width:800px;
      height:800px;
      flex-shrink:0;
      isolation:isolate;
      pointer-events:none;
      background:transparent;
      overflow:visible;
      margin:-40px -30px -40px 0;
      justify-self:end;
      align-self:center;
      user-select:none;
      -webkit-user-select:none;
      -webkit-user-drag:none;
    }
    @media(max-width:700px){
      .hero-bh{width:360px; height:360px; margin:-20px -30px -20px 0}
    }
    @media(max-width:520px){
      .hero-bh{
        position:absolute;
        right:-80px;
        top:10px;
        width:320px;
        height:320px;
        margin:0;
        opacity:0.55;
        z-index:1;
      }
    }
    .hero-bh video{will-change:transform;contain:paint;
      width:100%;
      height:100%;
      object-fit:contain;
      display:block;
      border-radius:0;
      transform:none;
      -webkit-mask-image:radial-gradient(ellipse 68% 62% at 50% 50%, black 42%, transparent 74%);
      mask-image:radial-gradient(ellipse 68% 62% at 50% 50%, black 42%, transparent 74%);
      filter:brightness(1.08) contrast(1.06) saturate(1.02);
      opacity:0.98;
      user-select:none;
      -webkit-user-select:none;
      -webkit-user-drag:none;
      pointer-events:none;
    }

    /* sections — plain */
    section{padding:32px 0 0}
    section.status{padding-top:96px}
    .bio-header{
      margin:0 0 20px;
      font-family:'Inter', system-ui, sans-serif;
      font-weight:700;
      font-size:clamp(32px, 4.5vw, 42px);
      line-height:1.1;
      letter-spacing:-0.03em;
      color:var(--text);
    }
    .status-grid{
      display:grid;
      grid-template-columns:1fr 360px;
      gap:20px 28px;
      align-items:start;
    }
    @media(max-width:760px){
      .status-grid{grid-template-columns:1fr}
    }
    .ascii-art-img{
      display:block;
      width:100%;
      height:auto;
      max-width:360px;
      image-rendering:-webkit-optimize-contrast;
      image-rendering:crisp-edges;
      user-select:none;
      -webkit-user-select:none;
      pointer-events:none;
    }
    @media(max-width:760px){
      .ascii-art-img{max-width:300px}
    }
    .section-title{
      font-family:'Inter', system-ui, sans-serif;
      font-size:12px;
      font-weight:600;
      letter-spacing:0.08em;
      text-transform:uppercase;
      color:var(--muted);
      margin:0 0 14px;
    }
    .status .prose{margin-top:16px}
    .prose{
      color:#cbd5e1;
      font-size:15.5px;
      line-height:1.78;
      margin:0;
      max-width:62ch;
    }
    .prose strong{color:var(--text); font-weight:600}

    .projects{
      list-style:none;
      margin:16px 0 0;
      padding:0;
      border-top:1px solid var(--border);
    }
    .project{
      padding:22px 0;
      border-bottom:1px solid var(--border);
    }
    .project-head{
      display:flex;
      flex-wrap:wrap;
      gap:8px 12px;
      align-items:baseline;
      margin-bottom:6px;
    }
    .project-title{
      font-family:'Inter', sans-serif;
      font-size:16px;
      font-weight:600;
      letter-spacing:-0.02em;
      margin:0;
      color:var(--text);
    }
    .project-year{
      font-size:12px;
      color:var(--muted);
      margin-left:auto;
      font-family:'Inter', system-ui, sans-serif;
      font-weight:500;
    }
    @media(max-width:640px){ .project-year{margin-left:0} }
    .project-desc{
      margin:8px 0 10px;
      color:#94a3b8;
      font-size:13.8px;
      line-height:1.7;
      max-width:60ch;
    }
    .project-stack{
      font-size:12px;
      color:var(--muted);
      margin:0 0 12px;
      font-family:'Inter', system-ui, sans-serif;
      font-weight:400;
    }
    .project-links{
      display:flex; gap:16px; flex-wrap:wrap;
      font-size:12.5px;
      color:var(--muted);
      font-family:'Inter', system-ui, sans-serif;
      font-weight:400;
    }
    .project-links a{border-bottom:1px solid var(--border); padding-bottom:1px}
    .project-links a:hover{color:var(--text); border-bottom-color:var(--text)}

    /* projects — new card layout (3 vertical boxes) */
    .projects-grid{border-top:1px solid var(--border)}
    .project-card{
      display:block;
      border:1px solid rgba(255,255,255,0.08);
      background:rgba(255,255,255,0.03);
      border-radius:16px;
      overflow:hidden;
    }
    .card-media{
      height:168px;
      background:#0a0a0a;
      border-bottom:1px solid rgba(255,255,255,0.06);
      overflow:hidden;
      position:relative;
    }
    .card-media .placeholder{
      width:100%; height:100%;
      display:flex; align-items:center; justify-content:center;
      font-family:'Inter', sans-serif;
      font-size:11px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase;
      color:var(--muted);
      background:linear-gradient(135deg, #0a0a0a 0%, #141418 100%);
    }
    .card-body{padding:18px 18px 18px}
    .card-title{
      font-family:'Inter', sans-serif;
      font-size:15.5px; font-weight:600; letter-spacing:-0.02em;
      margin:0 0 8px; color:var(--text);
    }
    .card-desc{
      color:#94a3b8; font-size:13.6px; line-height:1.65; margin:0 0 14px;
    }
    .card-tags{display:flex; flex-wrap:wrap; gap:8px}
    .card-tags span{
      padding:5px 10px;
      background:rgba(255,255,255,0.06);
      border:1px solid rgba(255,255,255,0.08);
      border-radius:999px;
      font-family:'Inter', sans-serif;
      font-size:11px; font-weight:500;
      color:var(--muted);
      pointer-events:none;
    }

    .exp-list{
      list-style:none;
      margin:16px 0 0;
      padding:0;
      border-top:1px solid var(--border);
    }
    .exp-item{
      display:grid;
      grid-template-columns:130px 1fr;
      gap:12px 18px;
      padding:16px 0;
      border-bottom:1px solid var(--border);
      font-size:13.8px;
      line-height:1.6;
    }
    section[aria-labelledby="edu-title"] .exp-list li:last-child{border-bottom:none}
    @media(max-width:640px){ .exp-item{grid-template-columns:1fr; gap:4px} }
    .exp-when{color:var(--muted); font-size:12px; white-space:nowrap; padding-top:1px; font-family:'Inter', system-ui, sans-serif; font-weight:500}
    .exp-what{color:#cbd5e1}
    .exp-what strong{color:var(--text); font-weight:600}
    .exp-what em{font-style:normal; color:#94a3b8}

    footer{
      margin-top:10px;
      padding:24px 0 44px;
      border-top:none;
      display:flex; flex-wrap:wrap; gap:12px 24px;
      justify-content:space-between;
      font-size:11.5px;
      color:var(--muted);
      font-family:'Inter', system-ui, sans-serif;
      font-weight:400;
    }
    footer a{border-bottom:1px solid transparent}
    footer a:hover{color:var(--text); border-bottom-color:var(--border)}

    .reveal{
      opacity:0;
      transform:translateY(18px);
      transition:opacity .65s ease, transform .65s cubic-bezier(.16,1,.3,1);
    }
    .reveal.in{
      opacity:1;
      transform:none;
    }
    @media(prefers-reduced-motion:reduce){ .reveal{opacity:1; transform:none; transition:none} }

    /* scroll hint — bouncing minimalist pointer */
    .scroll-hint{
      position:fixed;
      left:50%;
      bottom:28px;
      transform:translateX(-50%);
      width:40px;
      height:40px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:rgba(255,255,255,0.06);
      border:1px solid rgba(255,255,255,0.10);
      border-radius:999px;
      color:#fff;
      opacity:0.72;
      cursor:pointer;
      user-select:none;
      -webkit-user-select:none;
      animation:bounce-hint 1.85s ease-in-out infinite;
      transition:opacity .45s ease, transform .45s ease, background .15s, border-color .15s;
      z-index:20;
      appearance:none;
      -webkit-appearance:none;
      padding:0;
    }
    .scroll-hint:hover{background:rgba(255,255,255,0.10); border-color:rgba(255,255,255,0.16)}
    .scroll-hint:active{transform:translateX(-50%) scale(0.96)}
    .scroll-hint.hidden{
      opacity:0;
      transform:translateX(-50%) translateY(10px);
      pointer-events:none;
    }
    .scroll-hint svg{
      width:16px;
      height:16px;
      fill:none;
      stroke:currentColor;
      stroke-width:1.8;
      stroke-linecap:round;
      stroke-linejoin:round;
      display:block;
    }
    @keyframes bounce-hint{
      0%,100%{ transform:translateX(-50%) translateY(0) }
      50%{ transform:translateX(-50%) translateY(6px) }
    }
    @media(prefers-reduced-motion:reduce){ .scroll-hint{animation:none} }
    a:focus-visible{outline:1px solid rgba(255,255,255,0.5); outline-offset:3px}
  </style>
</head>

  <button id="scroll-hint" class="scroll-hint" aria-label="Scroll to bottom">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12l7 7 7-7"/></svg>
  </button>

  <script>
    if('scrollRestoration' in history) history.scrollRestoration = 'manual';
    window.scrollTo({top:0, left:0, behavior:'instant'});
    const yearEl = document.getElementById('year');
    if(yearEl) yearEl.textContent = new Date().getFullYear();
    const bhVideo = document.querySelector('.hero-bh video');
    if(bhVideo){
      bhVideo.addEventListener('contextmenu', e=>e.preventDefault());
      const tryPlay = ()=> bhVideo.play().catch(()=>{});
      tryPlay();
      document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) tryPlay(); }, {once:true});
    }
    const reveals = document.querySelectorAll('.reveal');
    if(reveals[0]) reveals[0].style.transitionDelay = '0ms';
    requestAnimationFrame(()=> reveals[0]?.classList.add('in'));
    const obs = new IntersectionObserver((entries)=>{
      entries.forEach(e=>{
        if(e.isIntersecting){
          e.target.classList.add('in');
          obs.unobserve(e.target);
        }
      });
    }, {threshold:0.06, rootMargin:'0px 0px 0px 0px'});
    reveals.forEach((el,i)=>{
      if(i===0) return;
      el.style.transitionDelay = `${Math.min(i*70, 220)}ms`;
      obs.observe(el);
    });
    // primary nav — static per-page (separate pages), no observer needed
    // macOS nav sliding highlight — super smooth + delayed
    const hl = document.getElementById('mac-highlight');
    const ml = document.getElementById('mac-links');
    if(hl && ml){
      const links = ml.querySelectorAll('a');
      const active = ml.querySelector('a[aria-current="page"]');
      const nav = hl.parentElement;
      const place = (el)=>{
        if(!el || !nav) return;
        const nr = nav.getBoundingClientRect();
        const r = el.getBoundingClientRect();
        hl.style.width = r.width + 'px';
        hl.style.transform = `translateX(${r.left - nr.left}px)`;
        hl.style.opacity = '1';
      };
      if(active) requestAnimationFrame(()=> place(active));
      links.forEach(a=>{
        a.addEventListener('mouseenter', ()=> place(a));
      });
      nav.addEventListener('mouseleave', ()=>{
        const cur = ml.querySelector('a[aria-current="page"]');
        if(cur) place(cur);
        else hl.style.opacity = '0';
      });
      window.addEventListener('resize', ()=>{ const cur = ml.querySelector('a[aria-current="page"]'); if(cur) place(cur); });
    }
    const hint = document.getElementById('scroll-hint');
    if(hint){
      let hidden = false;
      let touched = false;
      ['wheel','touchstart','touchmove','mousedown','keydown'].forEach(ev=>
        window.addEventListener(ev, ()=>{ touched = true; }, {passive:true, capture:true})
      );
      const hide = ()=>{
        if(hidden) return;
        hidden = true;
        hint.classList.add('hidden');
        setTimeout(()=> hint.remove(), 500);
        window.removeEventListener('scroll', onHintScroll);
      };
      hint.addEventListener('click', ()=>{
        window.scrollTo({top: document.documentElement.scrollHeight, behavior:'smooth'});
      });
      let early = true;
      window.addEventListener('load', ()=> setTimeout(()=>{ early = false; }, 4000));
      const onHintScroll = ()=>{
        if(touched){ if(window.scrollY > 24) hide(); }
        else if(early && window.scrollY > 0){ window.scrollTo({top:0, left:0, behavior:'instant'}); }
      };
      window.addEventListener('scroll', onHintScroll, {passive:true});
    }
  </script>
